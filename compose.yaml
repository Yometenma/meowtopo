name: meowtopo

services:
  meowtopo:
    build: .
    image: meowtopo/meowtopo:local
    container_name: meowtopo
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
    environment:
      MEOWTOPO_DATA_DIR: /data
      MEOWTOPO_HTTP_ADDR: 0.0.0.0:8088
      # TZ: Asia/Shanghai
