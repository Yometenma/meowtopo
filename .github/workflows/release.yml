name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - goos: linux
            label: linux
            arch: amd64
            ext: ''
            archive: tar.gz
          - goos: linux
            label: linux
            arch: arm64
            ext: ''
            archive: tar.gz
          - goos: windows
            label: windows
            arch: amd64
            ext: .exe
            archive: zip
          - goos: windows
            label: windows
            arch: arm64
            ext: .exe
            archive: zip
          - goos: darwin
            label: macos
            arch: amd64
            ext: ''
            archive: tar.gz
          - goos: darwin
            label: macos
            arch: arm64
            ext: ''
            archive: tar.gz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          package="meowtopo-${{ matrix.label }}-${{ matrix.arch }}"
          mkdir -p "dist/${package}"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${package}/meowtopo${{ matrix.ext }}" ./cmd/meowtopo
          cp README.md LICENSE ASSETS_LICENSE.md "dist/${package}/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -r "${package}.zip" "${package}")
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: meowtopo-${{ matrix.label }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/yometenma/meowtopo
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
