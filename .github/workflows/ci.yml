name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check frontend JavaScript
        run: |
          node --check internal/app/web/app.js
          node --check internal/app/web/features.js
      - name: Build single binary
        run: go build -trimpath -ldflags="-s -w" -o meowtopo ./cmd/meowtopo
      - name: Validate Compose
        run: docker compose config --quiet

